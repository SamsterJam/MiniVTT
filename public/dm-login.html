<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM Login</title>
  <link rel="icon" type="image/png" href="/MiniVTT_Logo_DM.png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow: auto;
    }

    #login-container {
      width: min(380px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: var(--shadow);
      text-align: center;
    }

    #login-container img {
      width: 84px;
      margin-bottom: 18px;
    }

    #login-container h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 600;
    }

    #login-container p {
      margin: 0 0 22px;
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.55;
    }

    #login-container code {
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      font-size: 12px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="password"] {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button {
      height: 38px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background var(--dur) var(--ease);
    }

    button:hover {
      background: var(--accent-hover);
    }

    #error {
      margin-bottom: 18px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background: var(--danger-dim);
      color: #ffc4c4;
      font-size: 13px;
    }

    #error[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="login-container">
    <img src="/MiniVTT_Logo_DM.png" alt="Mini VTT">
    <h1>DM Login</h1>
    <p id="error" hidden>That password was not correct.</p>
    <p>
      The DM password is printed to the server console at startup.
      Set <code>DM_PASSWORD</code> in the environment to choose your own.
    </p>
    <form method="POST" action="/dm-login">
      <input type="password" name="password" id="password" required autofocus
             placeholder="DM password" autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
  </div>

  <script>
    document.getElementById('error').hidden = !new URLSearchParams(location.search).has('error');
  </script>
</body>

</html>
